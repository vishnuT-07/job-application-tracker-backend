spring.application.name=job-application-tracker-backend

# Server Configuration (Render dynamically binds $PORT in production, defaults to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (PostgreSQL with Environment Variable Overrides)
# Works both locally and on Render (Render provides SPRING_DATASOURCE_URL or individual variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_tracker_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
# ddl-auto=update automatically creates/updates database tables matching Java Entities in PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.jobtracker=INFO
